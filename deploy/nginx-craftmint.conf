# Nginx site config for craftmint.in
# Install: sudo cp deploy/nginx-craftmint.conf /etc/nginx/sites-available/craftmint.in
#          sudo ln -s /etc/nginx/sites-available/craftmint.in /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
# Then run certbot to add HTTPS (see deploy/DEPLOY.md) — certbot will rewrite
# this file to add the SSL server block automatically.

server {
    listen 80;
    listen [::]:80;
    server_name craftmint.in www.craftmint.in;

    client_max_body_size 15M; # matches the 10MB upload limit in app/api/admin/upload

    # Static assets Next.js emits with content hashes — safe to cache hard.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Uploaded project images written by app/api/admin/upload
    location /uploads/ {
        proxy_pass http://127.0.0.1:3000;
        add_header Cache-Control "public, max-age=86400";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
